[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qlang"
version = "0.3.0"
description = "Python bindings for the QLang quantum language runtime"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/BrunoAwdd/qvm"

[tool.setuptools.packages.find]
where = ["python"]
