[package]
name = "qlang"
version = "0.3.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
qlang_core = { path = "../core" }
qlang-syntax = { path = "../qlang-syntax" }
qvm = { path = "../qvm" }
clap = { version = "4.0", features = ["derive"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"
rayon = "1.10"

[features]
default = ["cpu"]
cpu = ["qvm/cpu"]
cuda = ["qvm/cuda"]
tensor = ["qvm/tensor"]

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "qlang"
path = "src/main.rs"
