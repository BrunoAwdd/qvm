[package]
name = "qvm"
version = "0.3.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
qlang_core = { path = "../core" }
ndarray = "0.15"
num-complex = "0.4"
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
cust = { version = "0.3.2", optional = true }

[features]
cpu = []
cuda = ["dep:cust", "qlang_core/cuda"]
cuda-kernels = ["cuda"]
tensor = []
default = []
