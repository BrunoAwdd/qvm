name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: qvm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qvm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  tensor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qvm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qvm
      - run: cargo test --workspace --features tensor

  cuda-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qvm
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qvm
      - run: cargo check -p qvm --features cuda

  wasm-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: qlang-viewer/pnpm-lock.yaml
      - run: cargo test -p qlang-wasm
        working-directory: qvm
      - run: cargo build -p qlang-wasm --target wasm32-unknown-unknown --release
        working-directory: qvm
      - run: pnpm install --frozen-lockfile
        working-directory: qlang-viewer
      - run: pnpm build
        working-directory: qlang-viewer
      - run: pnpm lint --max-warnings=0
        working-directory: qlang-viewer

  python-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: cargo build -p qlang-ffi
        working-directory: qvm
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/python/test_ffi_runtime.py -q
